name: Security Audit

on:
  push:
    branches:
      - master
      - dev
      - 'fix/**'
      - 'ci/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  php-lint:
    name: PHP Syntax Check (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '7.4'
          - '8.1'
          - '8.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP files
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error \
            --exclude '.git' \
            --exclude 'vendor' \
            --exclude 'img'

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Composer audit
        if: hashFiles('composer.json') != ''
        run: |
          set -euo pipefail
          composer validate --no-check-publish --strict
          composer audit --format=plain

      - name: NPM audit
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json') != ''
        run: |
          set -euo pipefail
          npm audit --audit-level=moderate

      - name: No dependency manifests
        if: hashFiles('composer.json', 'package-lock.json', 'npm-shrinkwrap.json') == ''
        run: echo "No Composer or NPM dependency manifest found; dependency audit skipped."
